[project]
name = "expirito"
dynamic = ["version"]
description = "A utility to clean up old files and empty directories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.urls]
Homepage = "https://github.com/mmacpherson/expirito"

[project.scripts]
expirito = "expirito:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["expirito"]

[tool.setuptools.dynamic]
version = { attr = "expirito.__version__" }

[dependency-groups]
dev = ["pytest"]

[tool.ruff]
# Match black's default line length
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Enable common linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
# Match isort configuration
known-first-party = ["expirito"]

[tool.ruff.format]
# Match black's formatting style
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
